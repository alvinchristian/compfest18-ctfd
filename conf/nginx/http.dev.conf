worker_processes 4;

events {
  worker_connections 1024;
}

http {
  log_format timed '$remote_addr [$time_local] "$request" $status '
                  'request_time=$request_time upstream_time=$upstream_response_time';
  access_log /dev/stdout timed;

  # Keep forwarded client IP behavior aligned with the production proxy while
  # accepting plain HTTP for local development.
  map $http_cf_connecting_ip $client_ip {
    default $http_cf_connecting_ip;
    ""      $remote_addr;
  }

  upstream app_servers {
    server ctfd:8000;
  }

  server {
    listen 80;
    server_name _;

    gzip on;
    client_max_body_size 4G;

    location /events {
      proxy_pass http://app_servers;
      proxy_set_header Connection '';
      proxy_http_version 1.1;
      chunked_transfer_encoding off;
      proxy_buffering off;
      proxy_cache off;
      proxy_redirect off;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $client_ip;
      proxy_set_header X-Forwarded-Host $server_name;
      proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
      proxy_pass http://app_servers;
      proxy_redirect off;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $client_ip;
      proxy_set_header X-Forwarded-Host $server_name;
      proxy_set_header X-Forwarded-Proto $scheme;
    }
  }
}

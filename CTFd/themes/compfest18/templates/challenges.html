{% extends "base.html" %}

{% block content %}
  <div class="challenge-jumbotron">
    <div class="container">
      <h1>
        {% trans %}Challenges{% endtrans %}
      </h1>
    </div>
  </div>

  <div class="container">
    <div class="row">
      <div class="col-md-12">
        {% include "components/errors.html" %}
      </div>
    </div>

    <div id="onevone-game-timer" class="alert alert-primary d-none align-items-center justify-content-center mb-4 py-3" role="status" aria-label="1v1 game countdown">
      <strong id="onevone-game-timer-value" class="display-4 mb-0" style="font-variant-numeric: tabular-nums; letter-spacing: .08em;">20:00</strong>
    </div>

    <div 
      x-data="ChallengeBoard" 
      @load-challenges.window="loadChallenges()" 
      @load-challenge.window="loadChallenge($event.detail)"
    >
      <div
          x-ref="challengeWindow" id="challenge-window" class="modal fade" tabindex="-1" role="dialog" x-data=""
          x-html="$store.challenge.data.view"
      ></div>

      <div x-show="!loaded">
        <div class="min-vh-50 d-flex align-items-center">
          <div class="text-center w-100">
            <i class="fas fa-circle-notch fa-spin fa-3x fa-fw spinner"></i>
          </div>
        </div>
      </div>

      <div x-show="loaded" x-cloak style="display:none">
        <div class="challenge-toolbar d-flex gap-2 mb-3">
          <div class="challenge-search">
            <span class="challenge-search-icon"><i class="fas fa-search"></i></span>
            <input
              type="text"
              placeholder="{% trans %}Search challenges...{% endtrans %}"
              x-model="searchQuery"
            >
          </div>
          <div class="dropdown">
            <button class="challenge-filter-btn dropdown-toggle" type="button" data-bs-toggle="dropdown" data-bs-auto-close="outside">
              {% trans %}Filter{% endtrans %}
            </button>
            <ul class="dropdown-menu">
              <template x-for="cat in getAllCategories()" :key="cat">
                <li>
                  <label class="dropdown-item category-filter d-flex align-items-center gap-2">
                    <input
                      type="checkbox"
                      class="form-check-input mt-0"
                      :value="cat"
                      :checked="selectedCategories.includes(cat)"
                      @change="toggleCategory(cat)"
                    >
                    <span x-text="cat"></span>
                  </label>
                </li>
              </template>
            </ul>
          </div>
          <label class="category-filter d-flex align-items-center gap-2 ms-2">
            <input
              type="checkbox"
              class="form-check-input mt-0"
              x-model="hideSolved"
            >
            <span>{% trans %}Hide solved challenges{% endtrans %}</span>
          </label>
        </div>

        <template x-for="(category, idx) in getCategories()" :key="idx">
          <div class="pt-5">
            <div class="category-header mb-3">
              <h3 x-text="category"></h3>
            </div>

            <div class="category-challenges d-flex flex-column">
              <div class="challenges-row row">
                <template x-for="(c, idx) in getChallenges(category)" :key="c.id">
                  <div class="col-sm-6 col-md-4 col-lg-3 my-3">
                    <button
                        class="challenge-button btn btn-dark w-100 h-100 d-flex align-items-start"
                        :class="[
                          c.solved_by_me ? 'challenge-solved' : '',
                          ...c.tags.map((tag) => `tag-${tag.value.replace(/ /g, '-')}`),
                        ];"
                        :style="'border-left: 4px solid ' + categoryColor(category)"
                        :value="c.id" @click="loadChallenge(c.id)"
                    >

                      <div class="challenge-inner mb-3 text-start">
                        <p class="fw-semibold mb-1" x-text="c.name"></p>
                        <small><span x-text="c.value"></span> points</small>
                        <br>
                        <small class="text-muted"><span x-text="c.solves"></span> solves</small>
                      </div>
                      <i class="fas fa-flag challenge-solved-icon" x-show="c.solved_by_me"></i>
                    </button>
                  </div>
                </template>
              </div>
            </div>
          </div>
        </template>
      </div>
    </div>
  </div>
{% endblock %}

{% block scripts %}
  {{ Assets.js("assets/js/challenges.js") }}
  <script>
    (() => {
      const banner = document.getElementById("onevone-game-timer");
      const value = document.getElementById("onevone-game-timer-value");
      const endpoint = {{ url_for('onevone.draft_state') | tojson }};
      let offset = 0;
      let game = null;
      const format = (total) => {
        total = Math.max(0, Math.floor(total));
        const hours = Math.floor(total / 3600);
        const minutes = Math.floor((total % 3600) / 60);
        const seconds = total % 60;
        return `${String(hours).padStart(2, "0")}:${String(minutes).padStart(2, "0")}:${String(seconds).padStart(2, "0")}`;
      };
      const render = () => {
        if (!game || game.is_tiebreaker) {
          banner.classList.add("d-none");
          banner.classList.remove("d-flex");
          return;
        }
        banner.classList.remove("d-none");
        banner.classList.add("d-flex");
        if (game.paused) {
          banner.classList.remove("alert-primary", "alert-secondary");
          banner.classList.add("alert-warning");
          value.textContent = format(game.paused_remaining_seconds || 0);
        } else {
          if (!game.started_at) {
            banner.classList.remove("alert-primary", "alert-warning");
            banner.classList.add("alert-secondary");
            value.textContent = format(game.timer_seconds || 0);
          } else {
            banner.classList.remove("alert-warning", "alert-secondary");
            banner.classList.add("alert-primary");
            const remaining = game.deadline ? Math.max(0, Date.parse(game.deadline) - (Date.now() + offset)) : 0;
            value.textContent = format(Math.ceil(remaining / 1000));
          }
        }
      };
      const poll = () => fetch(endpoint, { credentials: "same-origin", cache: "no-store" })
        .then(response => response.json())
        .then(payload => {
          if (payload.success && payload.data) {
            if (payload.data.server_time) offset = Date.parse(payload.data.server_time) - Date.now();
            game = payload.data.game;
            render();
          }
        }).catch(() => {}).finally(() => window.setTimeout(poll, 1000));
      window.setInterval(render, 200);
      poll();
    })();
  </script>
{% endblock %}
